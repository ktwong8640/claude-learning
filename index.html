<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counter</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #1e1e2f;
    --card: #2a2a40;
    --text: #f4f4f8;
    --accent: #7c5cff;
    --accent-hover: #9376ff;
    --danger: #ff5c7c;
    --danger-hover: #ff7a94;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 2.5rem 3rem;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  }

  h1 {
    margin: 0 0 1.5rem;
    color: var(--text);
    font-size: 1.25rem;
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  #count {
    font-size: 4rem;
    font-weight: 700;
    color: var(--text);
    margin: 0 0 2rem;
    min-width: 3ch;
    transition: transform 0.15s ease;
  }

  #count.bump {
    transform: scale(1.15);
  }

  .buttons {
    display: flex;
    gap: 1rem;
    justify-content: center;
  }

  button {
    border: none;
    border-radius: 10px;
    padding: 0.75rem 1.5rem;
    font-size: 1.5rem;
    font-weight: 600;
    cursor: pointer;
    color: white;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  button:active {
    transform: scale(0.95);
  }

  #decrement {
    background: var(--danger);
  }

  #decrement:hover {
    background: var(--danger-hover);
  }

  #increment {
    background: var(--accent);
  }

  #increment:hover {
    background: var(--accent-hover);
  }

  #reset {
    margin-top: 1.25rem;
    background: transparent;
    color: #a0a0b8;
    font-size: 0.9rem;
    font-weight: 400;
    padding: 0.4rem 1rem;
    text-decoration: underline;
  }

  #reset:hover {
    color: var(--text);
    background: transparent;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Interactive Counter</h1>
  <div id="count">0</div>
  <div class="buttons">
    <button id="decrement" aria-label="Decrease count">&minus;</button>
    <button id="increment" aria-label="Increase count">&plus;</button>
  </div>
  <button id="reset">Reset</button>
</div>

<script>
  const countEl = document.getElementById('count');
  const incrementBtn = document.getElementById('increment');
  const decrementBtn = document.getElementById('decrement');
  const resetBtn = document.getElementById('reset');

  let count = 0;

  function render() {
    countEl.textContent = count;
    countEl.classList.remove('bump');
    void countEl.offsetWidth;
    countEl.classList.add('bump');
  }

  incrementBtn.addEventListener('click', () => {
    count++;
    render();
  });

  decrementBtn.addEventListener('click', () => {
    count--;
    render();
  });

  resetBtn.addEventListener('click', () => {
    count = 0;
    render();
  });
</script>

</body>
</html>
